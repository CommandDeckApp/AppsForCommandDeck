<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Home Assistant">
  <!-- Home Assistant's mark, used nominatively to identify the integration: the
       rounded house silhouette in their blue, carrying the connected-node motif
       that reads as "smart home". Not recoloured or reshaped beyond fitting the
       96-square the other app icons use. -->
