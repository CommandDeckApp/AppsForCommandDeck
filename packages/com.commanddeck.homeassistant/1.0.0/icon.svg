      <stop offset="0" stop-color="#5FCDFF"/>
      <stop offset="1" stop-color="#2A9FD6"/>
    </linearGradient>
  </defs>
  <path fill="url(#hahouse)"
        d="M48 11a5 5 0 0 1 3.4 1.3L87 43.5a4.5 4.5 0 0 1 1.6 3.4V79a6 6 0 0 1-6 6H13.4a6 6 0 0 1-6-6V46.9a4.5 4.5 0 0 1 1.6-3.4L44.6 12.3A5 5 0 0 1 48 11z"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M48 58 36 46M48 58l12-12M48 58v18"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="48" cy="58" r="5"/>
    <circle cx="36" cy="46" r="4"/>
