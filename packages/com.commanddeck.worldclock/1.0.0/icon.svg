<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#dial)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="2"/>
  <!-- Meridians, so the dial reads as a globe as well as a clock. -->
  <g fill="none" stroke="#e0f2fe" stroke-opacity=".45" stroke-width="1.6">
    <ellipse cx="32" cy="32" rx="11" ry="26"/>
    <line x1="6" y1="32" x2="58" y2="32"/>
  </g>
  <g stroke="#f8fafc" stroke-width="3.4" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="17"/>
    <line x1="32" y1="32" x2="43" y2="38"/>
  </g>
  <circle cx="32" cy="32" r="3" fill="#f8fafc"/>
</svg>
